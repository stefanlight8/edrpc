[package]
name = "edrpc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
chrono = { version = "0.4.43", features = ["serde"] }
daito = { version = "0.1.0", path = "../daito/daito", features = ["api", "rpc"] }
dotenvy = "0.15.7"
edjr = { version = "0.1.4", features = ["full", "tokio", "stream"], path = "../../projects/edjr" }
futures-lite = "2.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
tokio = { version = "1.49.0", features = ["io-util", "net", "rt-multi-thread", "macros", "fs", "signal", "time"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "serde", "serde_json"] }
